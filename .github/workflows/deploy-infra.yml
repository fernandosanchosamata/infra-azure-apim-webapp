name: deploy-infra

on:
  push:
    branches:
      - develop        # 👈 SOLO develop
  workflow_dispatch:   # 👈 ejecución manual opcional

concurrency:
  group: deploy-infra-develop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 🔐 LOGIN CORRECTO A AZURE (SIN ERRORES DE PERMISOS)
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: 5f77615a-c480-4a23-89f5-c5888c8f53ec

      # 🚀 DESPLIEGUE REAL
      - name: Deploy Infrastructure (APIM + WebApp)
        run: pwsh ./deploy.ps1
