name: deploy-infra

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  id-token: write    # 👈 OBLIGATORIO para azure/login
  contents: read

concurrency:
  group: deploy-infra-develop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 🔐 LOGIN CORRECTO (OIDC)
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: 4a42d9ba-d900-40bd-93ea-6e3548f68daa

      # 🚀 DESPLIEGUE REAL
      - name: Deploy Infrastructure (APIM + WebApp)
        run: pwsh ./deploy.ps1
