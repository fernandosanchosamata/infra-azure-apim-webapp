name: deploy-infra

on:
  push:
    branches:
      - develop        # 👈 SOLO develop
  workflow_dispatch:   # 👈 opcional, ejecución manual

concurrency:
  group: deploy-infra-develop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/cli@v2
        with:
          inlineScript: |
            az login --service-principal \
              -u ${{ secrets.AZURE_CLIENT_ID }} \
              -p ${{ secrets.AZURE_CLIENT_SECRET }} \
              --tenant ${{ secrets.AZURE_TENANT_ID }}

      - name: Deploy Infrastructure (APIM + WebApp)
        run: pwsh ./deploy.ps1
