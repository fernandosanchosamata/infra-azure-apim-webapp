name: deploy-infra

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-infra-develop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 🔐 LOGIN CON CLIENT SECRET (CLÁSICO, SEGURO)
      - name: Azure Login
        uses: azure/login@v1
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          subscription-id: 4a42d9ba-d900-40bd-93ea-6e3548f68daa

      # 🚀 DESPLIEGUE
      - name: Deploy Infrastructure (APIM + WebApp)
        run: pwsh ./deploy.ps1
