name: deploy-infra

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-infra-develop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 🔐 LOGIN CORRECTO CON CLIENT SECRET
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 🚀 DESPLIEGUE
      - name: Deploy Infrastructure (APIM + WebApp)
        run: pwsh ./deploy.ps1
